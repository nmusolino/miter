name: Main

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-out-and-set-up-env:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: ["macos-latest", "ubuntu-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

  build:
    needs: [check-out-and-set-up-env]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Build
        run: make build

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: 3.12

      - name: Test import
        run: python -c "import miter"

      - name: Lint
        run: make lint

      - name: Tests
        run: make test
