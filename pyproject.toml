[project]
name = "miter"
version = "0.1.0"
description = "Performant functions for iterables and sequences"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
authors = [
    { name = "Nicholas Musolino", email = "n.musolino@gmail.com" },
]

[dependency-groups]
dev = [
    "cmake>=4.0.3",
    "myst-parser>=4.0.1",
    "nanobind>=2.7.0",
    "python-docs-theme>=2025.5",
    "rust-just>=1.40.0",
    "scikit-build-core>=0.11.4",
    "sphinx>=8.2.3",
    "uv>=0.7.13",
]

[project.urls]
Homepage = ""

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"

[tool.scikit-build.cmake]
args = ["--warn-uninitialized"]
define = {CMAKE_EXPORT_COMPILE_COMMANDS = "True"}

[tool.cibuildwheel]
# Necessary to see build output from the actual compilation
build-verbosity = 1

# Run pytest to ensure that the package was correctly built
test-command = "pytest {project}/tests"
test-requires = "pytest"

# Needed for full C++17 support
[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.14"
